name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version
          RAW_VERSION="$(java -version 2>&1 | awk -F '"' '/version/ {print $2; exit}')"
          if [ -z "${RAW_VERSION}" ]; then
            echo "ERROR: Unable to detect Java version."
            exit 1
          fi
          MAJOR_VERSION="${RAW_VERSION%%.*}"
          if [ "${MAJOR_VERSION}" = "1" ]; then
            MAJOR_VERSION="$(echo "${RAW_VERSION}" | cut -d'.' -f2)"
          fi
          if ! [[ "${MAJOR_VERSION}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not parse Java major version from '${RAW_VERSION}'."
            exit 1
          fi
          echo "Detected Java major version: ${MAJOR_VERSION}"
          if [ "${MAJOR_VERSION}" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, found ${RAW_VERSION}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [ ! -f "./debug.keystore" ]; then
            KEYTOOL_BIN="keytool"
            if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
              KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            fi
            "${KEYTOOL_BIN}" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Temporary ./debug.keystore could not be created."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "${APK_PATH}" ]; then
            echo "ERROR: Expected APK not found at ${APK_PATH}"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "${APK_PATH}" ]; then
            echo "ERROR: ${APK_PATH} is not a regular file."
            exit 1
          fi
          if [ ! -s "${APK_PATH}" ]; then
            echo "ERROR: ${APK_PATH} is empty."
            exit 1
          fi
          if [[ "${APK_PATH}" != *.apk ]]; then
            echo "ERROR: ${APK_PATH} does not have the .apk extension."
            exit 1
          fi
          echo "Verified debug APK: ${APK_PATH}"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${SRC_APK}" ] || [ ! -s "${SRC_APK}" ]; then
            echo "ERROR: Source APK ${SRC_APK} is missing or empty."
            exit 1
          fi
          TEMP_DIR="$(mktemp -d "${RUNNER_TEMP}/release-asset-XXXXXX")"
          DEST_APK="${TEMP_DIR}/app-debug.apk"
          cp "${SRC_APK}" "${DEST_APK}"
          echo "asset_path=${DEST_APK}" >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset at ${DEST_APK}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "ERROR: GitHub CLI (gh) is not available."
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "ERROR: Prepared APK release asset is missing or empty."
            exit 1
          fi
          if [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "ERROR: Prepared release asset does not end in .apk."
            exit 1
          fi
          if [ "$(basename "${ASSET_PATH}")" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be exactly app-debug.apk."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}
          - Source Commit SHA: ${GITHUB_SHA}

          Important Notices:
          - This APK is intended for testing only.
          - This APK is NOT a Google Play Store production release.
          - This APK is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify_apk.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          if [ "${RELEASE_OUTCOME}" = "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "${RELEASE_TAG}" --json tagName,name,url,assets --jq '{tag: .tagName, title: .name, url: .url, assets: [.assets[].name]}'
            RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url --jq '.url')"
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_URL}"
            echo "Backup GitHub Actions artifact 'app-debug-apk' remains available."
            {
              echo "### DIRECT APK DOWNLOAD"
              echo ""
              echo "${DIRECT_URL}"
              echo ""
              echo "- Release Tag: \`${RELEASE_TAG}\`"
              echo "- Release Title: \`Debug APK Build #${GITHUB_RUN_NUMBER}\`"
              echo "- Release Page: ${RELEASE_URL}"
              echo "- Asset Filename: \`app-debug.apk\`"
              echo "- Backup Actions Artifact: \`app-debug-apk\` remains available."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "WARNING: GitHub Release publishing failed."
            if [ "${VERIFY_OUTCOME}" = "success" ]; then
              echo "The debug APK build succeeded (app/build/outputs/apk/debug/app-debug.apk)."
            else
              echo "The debug APK build did not succeed."
            fi
            if [ "${UPLOAD_OUTCOME}" = "success" ]; then
              echo "The GitHub Actions artifact named 'app-debug-apk' remains available as a backup."
            fi
            {
              echo "### GitHub Release Publishing Failed"
              echo ""
              if [ "${VERIFY_OUTCOME}" = "success" ]; then
                echo "- Debug APK build succeeded."
              else
                echo "- Debug APK build did not succeed."
              fi
              if [ "${UPLOAD_OUTCOME}" = "success" ]; then
                echo "- Backup GitHub Actions artifact \`app-debug-apk\` remains available."
              fi
              echo "- The new APK is NOT available via the latest-release direct download URL."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
